name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web App and Sync Capacitor
        run: |
          cd web
          npm run cap:build

      - name: Build Android APK
        run: |
          cd web/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeGuard-AI-App
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Release APK Asset
        run: cp web/android/app/build/outputs/apk/debug/app-debug.apk LifeGuard-AI.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LifeGuard AI Latest Android App (APK)"
          files: LifeGuard-AI.apk
          overwrite: true
